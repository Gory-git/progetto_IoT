	position:relative;

	position:relative;
	top:0px;

/*	background-color:#1F67B1;*/
}

<script type="text/javascript">

//<%getInfo("uploadfmtime")%>;

var waittime=20000;
var ip="<%getInfo("ip");%>";
function GetArgsFromHref(sArgName) 
{ 
var sHref=this.location.href;
var args = sHref.split("?");
 var retval = "";
 if(args[0] == sHref) /*参数为空*/
 { 
return retval; /*无需做任何处理*/ 
}
 var str = args[1];
 args = str.split("&"); 
for(var i = 0; i < args.length; i ++)
 { 
str = args[i]; 
var arg = str.split("=");
 if(arg.length <= 1) continue; 
if(arg[0] == sArgName) 
retval = arg[1];
 }
 return retval;
 }
function countdowntime()
{
	var flag=GetArgsFromHref("flag");
	var IP_addr=GetArgsFromHref("ip")
	if(flag)
		waittime=flag;
	if(IP_addr)
		ip=IP_addr;
}

var sec = 0;
var step_px = 4;
var max_px = 400;
var step_sec = 0;
function process()
{
	sec++;
	if (sec<100)
	{
		get_by_id("id_process_ing").style.width = step_px*sec+"px";
		get_by_id("id_num").innerHTML = parseInt((step_px*sec/max_px)*100)+"%"
		setTimeout("process()", step_sec);
	}
	else
	{
		get_by_id("id_process_ing").style.width = max_px + "px";
		get_by_id("id_num").innerHTML = "100%"
		window.top.location.href = "http://"+ip+"/home.htm";
	}
}

function countDown()
{
	var numb;
	countdowntime();
	function brand(a) 
	{
	  return parseInt((a)*Math.random()+1);
	}
	function goUrl(){
	numb=brand(5);
		window.top.location.href = "http://"+ip+"/home.htm";
	}

	//setTimeout(goUrl,waittime)//毫秒

	step_sec=waittime/100;
	if (waittime>0)
	{
		show_div(true, "id_span");
		setTimeout("process()", step_sec);
	}
}
</script>
</head>
