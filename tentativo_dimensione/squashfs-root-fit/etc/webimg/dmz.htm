<head>
<meta http-equiv="Content-Type" content="text/html">
<link type="text/css" rel="stylesheet" href="style.css" />

<% getIndex("no-cache"); %>
<title>DMZ Host</title>
<script type="text/javascript" src="util_gw.js"> </script>
<script>
function saveClick()
{
  if (!document.formDMZ.enabled.checked)
  	return true;

  if (document.formDMZ.ip.value=="")
	return true;

  if ( checkIpAddr(document.formDMZ.ip, tz.alert3) == false )
	    return false;

  return true;
}

function updateState()
{
  if (document.formDMZ.enabled.checked) {
 	enableTextField(document.formDMZ.ip);
  }
  else {
 	disableTextField(document.formDMZ.ip);
	//document.formDMZ.ip.style.backgroundColor="#e0e0e0";
  }
}

function Load_Setting()
{
	if ( <% getIndex("dmzEnabled"); %> )
		document.formDMZ.enabled.checked = true;
	updateState();
}
</script>
</head>

<body onLoad="Load_Setting();">

<div align="center">
<table border=0 width="100%" cellspacing=0 cellpadding=0>
<tr><td class="headspace"></td></tr>
   <tr> <td><table width="100%" border="0" cellspacing="0" cellpadding="0">
        <tr>
          <td class="headline"  width="100%">&nbsp;
          <%trans("f_dmz.h2")%>
		  </td>

        </tr>
      </table></td></tr>
</table>
<form action=/boafrm/formDMZ method=POST name="formDMZ">
<fieldset><legend><%trans("f_dmz.legend")%></legend>
<table width="100%">
<tr><td align="left"><font size=2>
  
    <input type="checkbox" name="enabled" value="ON" ONCLICK=updateState()>
    &nbsp;&nbsp;<%trans("f_dmz.enable");%></font>
  </td>
</tr>
<tr height="20"><td></td></tr>
<tr><td align="center">
     <font size=2><%trans("f_dmz.ipaddr");%>: <input type="text" name="ip" size="15" maxlength="15" value=<% getInfo("dmzHost"); %> ></font>
</td></tr>
<tr><td>
   <br>
  
        <input type="hidden" value="/dmz.htm" name="submit-url">
</td></tr></table>
     <script> updateState(); </script>
</table></fieldset>
	 <table width="100%"><tr>                  
  <td class="submitFooter" width="100%"><script type="text/javascript">
   document.write('<input type="submit" class="submit" value="'+share.apply+'" name="save"  onClick="return saveClick()">');
	document.write('&nbsp;&nbsp;')
   document.write('<input type="reset" class="submit" value="'+share.reset+'" name="reset">');
  
	</script></td></tr></table>

</form>

</div>

</body>
</html>
