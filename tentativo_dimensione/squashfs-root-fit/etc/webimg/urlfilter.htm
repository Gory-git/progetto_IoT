<head>
<meta http-equiv="Content-Type" content="text/html">
<link type="text/css" rel="stylesheet" href="style.css" />

<% getIndex("no-cache"); %>
<title>URL Filtering</title>
<script type="text/javascript" src="util_gw.js"> </script>
<script>
function addClick()
{
  if (!document.formFilterAdd.enabled.checked)
  	return true;
  var str = document.formFilterAdd.url.value;
	for (var i=0; i<str.length; i++) {
     		if ( str.charAt(i) == ';')
     		{
     			alert("Error character: \";\"");
			return false;
     		}
	}
			
  if (document.formFilterAdd.url.value=="")
	return true;

  return true;
}

function deleteClick()
{
  if ( !confirm(f_url.msg3) ) {
	return false;
  }
  else
	return true;
}

function deleteAllClick()
{
   if ( !confirm(f_url.msg4) ) {
	return false;
  }
  else
	return true;
}

function disableDelButton()
{
	disableButton(document.formFilterDel.deleteSelFilterUrl);
	disableButton(document.formFilterDel.deleteAllFilterUrl);
}

function updateState()
{
  if (document.formFilterAdd.enabled.checked)
 	enableTextField(document.formFilterAdd.url);  
  else
 	disableTextField(document.formFilterAdd.url); 
}

function Load_Setting()
{
	if ( <% getIndex("urlFilterEnabled"); %> )
		document.formFilterAdd.enabled.checked = true;
	updateState();
}
</script>
</head>

<body onLoad="Load_Setting();">
<table border=0 width="100%" cellspacing=0 cellpadding=0>
<tr><td class="headspace"></td></tr>

   <tr><td><table width="100%" border="0" cellspacing="0" cellpadding="0">
   
        <tr>
          <td class="headline"  width="100%">&nbsp;
          <%trans("f_url.h2")%>		  </td>
        </tr>
      </table>


<form action=/boafrm/formFilter method=POST name="formFilterAdd">
<fieldset><legend><%trans("f_url.legend")%></legend>
<table border=0 width="100%" cellspacing=4 cellpadding=0>
<tr><td><font size=2>
   	<input type="checkbox" name="enabled" value="ON" ONCLICK=updateState()>&nbsp;&nbsp;<%trans("f_url.enable");%><br>
    </td>
</tr>
<tr><td><br /></td></tr>
<tr>
<tr height="20"><td></td></tr>
<td>
     &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<font size=2><%trans("f_url.range");%>:  <input type="text" name="url" size="30" maxlength="30">&nbsp;&nbsp;</font>
     <p>
        <input type="hidden" value="/urlfilter.htm" name="submit-url">
     </p>
     </td>
<tr>
  <script> updateState(); </script>
</table>
</fieldset>
	 <table width="100%"><tr>                  
  <td class="submitFooter" width="100%"><script type="text/javascript">
   document.write('<input type="submit" class="submit" value="'+share.apply+'" name="addFilterUrl"  onClick="return addClick()">');
	document.write('&nbsp;&nbsp;')
   document.write('<input type="reset" class="submit" value="'+share.reset+'" name="reset">');
  
	</script></td></tr></table>

</form>

<br>
<form action=/boafrm/formFilter method=POST name="formFilterDel">
<fieldset><legend><%trans("f_port.table")%></legend>
  <table border="0" width="100%">
  <% urlFilterList(); %>
  </table>
  </fieldset>
  <br>
        	 <table width="100%"><tr>                  
  <td class="submitFooter" width="100%"><script type="text/javascript">
   document.write('<input type="submit" class="submit" value="'+share.delsel+'" name="deleteSelFilterUrl"  onClick="return deleteClick()">');
	document.write('&nbsp;&nbsp;')
   document.write('<input type="submit" class="submit" value="'+share.delall+'" name="deleteAllFilterUrl" onClick="return deleteAllClick()">');
   	document.write('&nbsp;&nbsp;')
  document.write('<input type="reset" class="submit" value="'+share.reset+'" name="reset">')
	</script></td></tr></table>

   <input type="hidden" value="/urlfilter.htm" name="submit-url">
 <script>
	if ( <% getIndex("urlFilterNum"); %> == 0 )
		disableDelButton();
 </script>
</form>

</blockquote>
</body>
</html>
