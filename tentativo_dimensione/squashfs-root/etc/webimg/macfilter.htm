<head>
<meta http-equiv="Content-Type" content="text/html">
<link type="text/css" rel="stylesheet" href="style.css" />

<% getIndex("no-cache"); %>
<title>MAC Filtering</title>
<script type="text/javascript" src="util_gw.js"> </script>
<script>
function addClick()
{
  if (!document.formFilterAdd.enabled.checked)
  	return true;

  if (document.formFilterAdd.mac.value=="" && document.formFilterAdd.comment.value=="" )
	return true;

  var str = document.formFilterAdd.mac.value;
  if ( str.length < 12) {
	alert(wlan.ac_msg4);
	document.formFilterAdd.mac.focus();
	return false;
  }

  for (var i=0; i<str.length; i++) {
    if ( (str.charAt(i) >= '0' && str.charAt(i) <= '9') ||
			(str.charAt(i) >= 'a' && str.charAt(i) <= 'f') ||
			(str.charAt(i) >= 'A' && str.charAt(i) <= 'F') )
			continue;

	alert(wlan.ac_msg5);
	document.formFilterAdd.mac.focus();
	return false;
  }
  return true;
}


function deleteClick()
{
  if ( !confirm(f_mac.msg3) ) {
	return false;
  }
  else
	return true;
}

function deleteAllClick()
{
   if ( !confirm(f_mac.msg4) ) {
	return false;
  }
  else
	return true;
}

function disableDelButton()
{
	disableButton(document.formFilterDel.deleteSelFilterMac);
	disableButton(document.formFilterDel.deleteAllFilterMac);
}

function updateState()
{
  if (document.formFilterAdd.enabled.checked) {
 	enableTextField(document.formFilterAdd.mac);
	enableTextField(document.formFilterAdd.comment);
  }
  else {
 	disableTextField(document.formFilterAdd.mac);
	disableTextField(document.formFilterAdd.comment);
  }
}

function Load_Setting()
{
	if ( <% getIndex("macFilterEnabled"); %> )
		document.formFilterAdd.enabled.checked = true;
	updateState();
}
</script>
</head>

<body onLoad="Load_Setting();">
<table border=0 width="100%" cellspacing=0 cellpadding=0>
<tr><td class="headspace"></td></tr>
   <tr> <td><table width="100%" border="0" cellspacing="0" cellpadding="0">
        <tr>
          <td class="headline"  width="100%">&nbsp;
          <%trans("f_mac.h2")%>
		  </td>

        </tr>
      </table></td></tr>
</table>


<form action=/boafrm/formFilter method=POST name="formFilterAdd">
<fieldset><legend><%trans("f_mac.legend")%></legend>
<table border=0 width="500" cellspacing=4 cellpadding=0>
<tr><td><font size=2>
	<input type="checkbox" name="enabled" value="ON" ONCLICK=updateState()>&nbsp;&nbsp;<%trans("f_mac.enable");%><br>
    </td>
</tr>
<tr height="20"><td></td></tr>
<tr><td>
     <p><font size=2><%trans("f_mac.range");%>:  <input type="text" name="mac" size="15" maxlength="12">&nbsp;&nbsp;
   	<font size=2><%trans("share.comment");%>:  <input type="text" name="comment" size="16" maxlength="20"></font>
     </p>
	 
     <p>
        <input type="hidden" value="/macfilter.htm" name="submit-url">
     </p>
  </td><tr>
  <script> updateState(); </script>
</table>
</fieldset>
	 <table width="100%"><tr>                  
  <td class="submitFooter" width="100%"><script type="text/javascript">
   document.write('<input type="submit" class="submit" value="'+share.apply+'" name="addFilterMac"  onClick="return addClick()">');
	document.write('&nbsp;&nbsp;')
   document.write('<input type="reset" class="submit" value="'+share.reset+'" name="reset">');
  
	</script></td></tr></table>

</form>

<br>
<form action=/boafrm/formFilter method=POST name="formFilterDel">
<fieldset><legend><%trans("f_port.table")%></legend>
  <table border="0" width="100%">
  <% macFilterList(); %>
  </table>
  </fieldset>
  <br>
      	 <table width="100%"><tr>                  
  <td class="submitFooter" width="100%"><script type="text/javascript">
   document.write('<input type="submit" class="submit" value="'+share.delsel+'" name="deleteSelFilterMac"  onClick="return deleteClick()">');
	document.write('&nbsp;&nbsp;')
   document.write('<input type="submit" class="submit" value="'+share.delall+'" name="deleteAllFilterMac" onClick="return deleteAllClick()">');
   	document.write('&nbsp;&nbsp;')

  document.write('<input type="reset" class="submit" value="'+share.reset+'" name="reset">')
	</script></td></tr></table>

  <input type="hidden" value="/macfilter.htm" name="submit-url">
 <script>
	if ( <% getIndex("macFilterNum"); %> == 0 )
		disableDelButton();
 </script>
</form>

</blockquote>
</body>
</html>
